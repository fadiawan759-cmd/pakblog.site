name: PakBlog - Multi Page Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '10 */6 * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check public pages
        env:
          PAKBLOG_BASE_URL: https://pakblog.site
        run: node scripts/multi-page-monitor.mjs

      - name: Upload monitoring report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pakblog-page-monitor
          path: reports/page-monitor.json
          if-no-files-found: warn
          retention-days: 30
